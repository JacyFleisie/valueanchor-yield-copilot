[pytest]
testpaths = tests
# Coverage is on by default so the number is produced by the same command the
# developer already runs, and CI does not need its own separate invocation that
# can drift out of sync with the suite.
addopts =
    -q
    --cov
    --cov-report=term-missing:skip-covered
    --cov-report=xml
filterwarnings =
    # FastAPI's own deprecation noise is not actionable from here and would bury
    # a real warning from this codebase.
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:anyio.*
