[pytest]
testpaths = tests
# The modules under test live beside this file rather than in an installed
# package, and the `pytest` console script does not put the working directory on
# sys.path the way `python -m pytest` does - so `pytest` from `backend/` used to
# fail with "No module named 'app'" while `python -m pytest` passed. Stating the
# path makes both invocations, and CI, run the same suite.
pythonpath = .
# Coverage is on by default so the number is produced by the same command the
# developer already runs, and CI does not need its own separate invocation that
# can drift out of sync with the suite.
addopts =
    -q
    --cov
    --cov-report=term-missing:skip-covered
    --cov-report=xml
filterwarnings =
    # FastAPI's own deprecation noise is not actionable from here and would bury
    # a real warning from this codebase.
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:anyio.*
