name: Release

# The README hands owners a single Windows executable, so a version tag has to
# produce one. The build is the same script a developer runs locally
# (packaging/build_exe.py); this workflow only supplies the Windows runner and
# attaches the result to the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packaging/requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r packaging/requirements-build.txt

      - name: Build ValueAnchor.exe
        run: python packaging/build_exe.py

      - name: Upload the executable as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValueAnchor-windows
          path: dist/ValueAnchor.exe
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # `gh` ships on the runner. A re-run against an existing release uploads
        # over the asset instead of failing the job.
        run: |
          gh release create "${{ github.ref_name }}" dist/ValueAnchor.exe --title "ValueAnchor ${{ github.ref_name }}" --generate-notes
          if ($LASTEXITCODE -ne 0) { gh release upload "${{ github.ref_name }}" dist/ValueAnchor.exe --clobber }
