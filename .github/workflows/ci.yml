name: CI

# The suite is the only thing standing between a change and the owner of a shop
# being told the wrong number, so it runs on every push and every pull request
# rather than when somebody remembers.
on:
  push:
    # This repository's default branch is `main`; `master` is listed too so the
    # workflow keeps working if the branch is ever renamed.
    branches: [main, master]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# A newer push makes an in-flight run obsolete. Cancelling it frees the runner
# and keeps the check list short enough to read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter the project is developed and run on. The
          # pinned wheels in requirements.txt all publish cp314 builds.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every module
        # Cheap and fails fast: a syntax error anywhere is caught before the
        # suite spends ninety seconds importing the app. Every module that ships
        # is listed, including the evaluation set, the MCP server and the /v1
        # router - a file the suite imports by accident is not the same thing as
        # a file that is checked.
        run: python -m compileall -q app.py desktop.py api_v1.py mcp_server.py openedge.py yield_engine.py nlu evals tests

      - name: Run the suite with coverage
        # No OPENROUTER_API_KEY is set, so the network assistant switches itself
        # off and every test runs deterministically against a scratch database.
        env:
          VALUEANCHOR_DB: ${{ runner.temp }}/ci-valueanchor.db
        run: pytest tests -q

      - name: Score the evaluation set
        # The suite already runs this set in a subprocess; stating it as its own
        # step puts the score in the CI log instead of burying it in one pytest
        # line. Exit 0 needs every case judged and every one of them passing -
        # a skipped case, and therefore a truncated run, fails the job.
        env:
          VALUEANCHOR_DB: ${{ runner.temp }}/ci-evals.db
          # Empty, so the scored run is the offline engine rather than a model's.
          OPENROUTER_API_KEY: ""
        run: python -m evals.run_evals

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python -m coverage report --skip-covered || true
          fi

      - name: Upload coverage report
        # A convenience for reading the file after the run, never a verdict: the
        # numbers are already in the step above, and exhausting the account's
        # artifact storage quota must not turn a passing suite red.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` rather than `npm install`: it installs exactly the lockfile,
        # so CI cannot pass on a version the developer never had.
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
