name: CI

# The suite is the only thing standing between a change and the owner of a shop
# being told the wrong number, so it runs on every push and every pull request
# rather than when somebody remembers.
on:
  push:
    # This repository's default branch is `main`; `master` is listed too so the
    # workflow keeps working if the branch is ever renamed.
    branches: [main, master]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# A newer push makes an in-flight run obsolete. Cancelling it frees the runner
# and keeps the check list short enough to read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter the project is developed and run on. The
          # pinned wheels in requirements.txt all publish cp314 builds.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every module
        # Cheap and fails fast: a syntax error anywhere is caught before the
        # suite spends ninety seconds importing the app.
        run: python -m compileall -q app.py yield_engine.py nlu tests

      - name: Run the suite with coverage
        # No OPENROUTER_API_KEY is set, so the network assistant switches itself
        # off and every test runs deterministically against a scratch database.
        env:
          VALUEANCHOR_DB: ${{ runner.temp }}/ci-valueanchor.db
        run: pytest tests -q

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python -m coverage report --skip-covered || true
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm ci` rather than `npm install`: it installs exactly the lockfile,
        # so CI cannot pass on a version the developer never had.
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
